# ============================================================
# Partie 2B : Backend Spring Boot
# ConfigMap + Secret + Deployment + Services
# ============================================================

# ---------- 1. ConfigMap : configuration non sensible ----------
apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-config
  namespace: devops
data:
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-service:3306/springdb?allowPublicKeyRetrieval=true&useSSL=false"

---
# ---------- 2. Secret : identifiants encodes en base64 ----------
apiVersion: v1
kind: Secret
metadata:
  name: spring-secret
  namespace: devops
type: Opaque
data:
  SPRING_DATASOURCE_USERNAME: c3ByaW5n        # spring
  SPRING_DATASOURCE_PASSWORD: c3ByaW5nMTIz    # spring123

---
# ---------- 3. Deployment Spring Boot ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring
  namespace: devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring
  template:
    metadata:
      labels:
        app: spring
    spec:
      containers:
        - name: spring
          image: rbns10/gestion-projets-backend:1.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: spring-config
            - secretRef:
                name: spring-secret
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

---
# ---------- 4. Service Spring Boot (NodePort : accessible de l'exterieur) ----------
apiVersion: v1
kind: Service
metadata:
  name: spring-service
  namespace: devops
spec:
  type: NodePort
  selector:
    app: spring
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081

---
# ---------- 5. Service interne "backend" ----------
# Le Nginx de l'image frontend redirige /api/ vers http://backend:8080
# Ce service donne ce nom DNS aux memes pods Spring Boot.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: devops
spec:
  type: ClusterIP
  selector:
    app: spring
  ports:
    - port: 8080
      targetPort: 8080
